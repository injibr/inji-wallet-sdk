apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.vcsdkheadless'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://repo.danubetech.com/repository/maven-public/' }
    flatDir { dirs 'libs' }
}

configurations.all {
    exclude group: 'com.apicatalog', module: 'titanium-json-ld'
    exclude group: 'net.jcip', module: 'jcip-annotations'
}

dependencies {
    implementation 'com.facebook.react:react-android:+'
    implementation(name: 'inji-openid4vp', ext: 'aar')
    implementation(name: 'vcverifier', ext: 'aar')
    implementation('info.weboftrust:ld-signatures-java:1.5.0') {
        exclude group: 'org.bouncycastle'
    }
    implementation('decentralized-identity:jsonld-common-java:1.8.0') {
        exclude group: 'org.bouncycastle'
    }
    // jre8 variant - same as vc-verifier uses, works on Android
    implementation 'com.apicatalog:titanium-json-ld-jre8:1.3.1'
    implementation 'org.glassfish:jakarta.json:2.0.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.74'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.14.0'
    implementation('com.nimbusds:nimbus-jose-jwt:9.40') {
        exclude group: 'org.bouncycastle'
    }
}
